<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking Form</title>
</head>
<body>
    <fieldset>
      <h1 align="center">Hotel Room Booking Form</h1>
      <form action="#" align="center">
      <label for="name">Full Name:</label>
      <input type="text" name="name" id="name" placeholder="Enter your name">

      <br><br>
      <label for="email">Email:</label>
      <input type="email" name="email" id="email">

      <br><br>
      <label for="tel">Phone:</label>
      <input type="tel" name="tel" id="tel">

      <br><br>
      <label for="date">Check-in Date:</label>
      <input type="date" name="date" id="date">

      <br><br>
      <label for="date">Check-out Date:</label>
      <input type="date" name="date" id="date">

      <br><br>
      <label for="type">Room Type:</label>
      <select name="room type" id="room type">
        <option value="Select Room">Select Room</option>
        <option value="AC">AC</option>
        <option value="Non-AC">Non-AC</option>
      </select>

      <br><br>
      <label for="">Number of Guest:</label>
      <input type="number" name="number" id="number" max="5">
      
      <br><br>
      <label for="">Special Request:</label>
      <textarea name="request" id="requst"></textarea>

      <br><br>
      <input type="submit" value="Book Now">
      <input type="reset" value="Reset Form">

      </form>
    </fieldset>
    
</body>
</html>
